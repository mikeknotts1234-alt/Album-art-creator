<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Art Creator</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Album text -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
        }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .canvas-container {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            background-color: #000;
            position: relative;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Custom Input Styling */
        input[type="text"], textarea, select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.6);
            color: white;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-2 tracking-tight">Album Art Creator</h1>
            <p class="text-slate-400 text-sm md:text-base">Design your next single or album cover</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            
            <!-- Left Column: Controls (Order 2 on mobile, 1 on desktop) -->
            <div class="lg:col-span-5 space-y-6 order-2 lg:order-1">
                
                <!-- Typography Section -->
                <div class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-xl font-bold mb-4 text-purple-300">Typography</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Band / Artist Name</label>
                            <input type="text" id="band-name" placeholder="M.K. Iron" class="w-full p-3 rounded-lg text-sm" oninput="updateCanvas()">
                        </div>
                        <div>
                            <label class="block text-sm text-slate-400 mb-1">Song / Album Name</label>
                            <input type="text" id="song-name" placeholder="Enter song name..." class="w-full p-3 rounded-lg text-sm" oninput="updateCanvas()">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm text-slate-400 mb-1">Font Style</label>
                                <select id="font-select" class="w-full p-3 rounded-lg text-sm" onchange="updateCanvas()">
                                    <option value="Montserrat">Modern (Montserrat)</option>
                                    <option value="Bebas Neue">Bold (Bebas Neue)</option>
                                    <option value="Permanent Marker">Grungy (Marker)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm text-slate-400 mb-1">Text Color</label>
                                <div class="flex items-center gap-2 p-1 bg-slate-800 rounded-lg border border-slate-600 h-[46px]">
                                    <input type="color" id="text-color" value="#ffffff" class="w-full h-full rounded cursor-pointer border-0 bg-transparent p-0 m-0" oninput="updateCanvas()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Image Source Section -->
                <div class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-xl font-bold mb-4 text-pink-300">Cover Art Image</h2>
                    
                    <!-- Tabs -->
                    <div class="flex bg-slate-800 rounded-lg p-1 mb-4">
                        <button id="tab-upload" class="flex-1 py-2 text-sm font-semibold rounded-md bg-slate-700 text-white shadow transition-all" onclick="switchTab('upload')">Upload from Gallery</button>
                        <button id="tab-ai" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition-all" onclick="switchTab('ai')">AI Generator</button>
                    </div>

                    <!-- Upload Tab -->
                    <div id="content-upload" class="block">
                        <label class="block text-sm text-slate-400 mb-2">Select an image from your device</label>
                        <div class="relative w-full h-32 border-2 border-dashed border-slate-500 rounded-lg hover:border-purple-400 transition-colors flex flex-col items-center justify-center cursor-pointer group bg-slate-800/50">
                            <svg class="w-8 h-8 text-slate-400 group-hover:text-purple-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <span class="text-sm text-slate-400 group-hover:text-purple-400">Tap to browse gallery</span>
                            <input type="file" id="image-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="handleImageUpload(event)">
                        </div>
                    </div>

                    <!-- AI Tab -->
                    <div id="content-ai" class="hidden">
                        <label class="block text-sm text-slate-400 mb-2">Describe the perfect album art</label>
                        <textarea id="ai-prompt" rows="3" placeholder="e.g. A solitary astronaut standing on a neon glowing desert under a starry sky, cinematic lighting..." class="w-full p-3 rounded-lg text-sm mb-3 resize-none"></textarea>
                        
                        <button id="generate-btn" class="w-full py-3 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-lg shadow-lg flex justify-center items-center gap-2" onclick="generateAIImage()">
                            <span id="generate-text">Generate with AI</span>
                        </button>
                    </div>
                </div>
                
                <!-- Notification Box -->
                <div id="notification-box" class="hidden p-4 rounded-lg text-sm font-medium"></div>
            </div>

            <!-- Right Column: Preview & Output (Order 1 on mobile, 2 on desktop) -->
            <div class="lg:col-span-7 flex flex-col items-center order-1 lg:order-2">
                
                <div class="w-full bg-slate-800/50 p-3 rounded-2xl border border-slate-700 backdrop-blur-sm mb-6">
                    <div class="flex justify-between items-center px-2 py-2 mb-2">
                        <span class="text-sm font-semibold text-slate-300 uppercase tracking-widest">Live Preview</span>
                        <span class="text-xs text-slate-500 bg-slate-900 px-2 py-1 rounded">1080 x 1080</span>
                    </div>
                    
                    <!-- Canvas Container -->
                    <div class="canvas-container relative">
                        <canvas id="art-canvas" width="1080" height="1080"></canvas>
                        
                        <!-- Loading Overlay for AI -->
                        <div id="canvas-overlay" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center hidden backdrop-blur-sm z-10 transition-opacity">
                            <div class="loader mb-4 border-t-pink-500"></div>
                            <span class="text-pink-400 font-semibold tracking-wider text-sm">Synthesizing Visuals...</span>
                        </div>
                    </div>
                </div>

                <button id="download-btn" class="w-full max-w-[500px] py-4 bg-white text-slate-900 hover:bg-slate-200 font-bold rounded-xl shadow-[0_0_20px_rgba(255,255,255,0.15)] flex justify-center items-center gap-2 transition-transform active:scale-95" onclick="downloadCover()">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Download Album Art
                </button>
                
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('art-canvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_SIZE = 1080;
        let coverImage = null; 
        
        const GEMINI_API_KEY = ""; 
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent?key=${GEMINI_API_KEY}`;

        // Ensure custom fonts are loaded before initially drawing the canvas
        document.fonts.ready.then(() => {
            updateCanvas();
        });

        // Tab Switching Logic
        function switchTab(tab) {
            const btnUpload = document.getElementById('tab-upload');
            const btnAi = document.getElementById('tab-ai');
            const contentUpload = document.getElementById('content-upload');
            const contentAi = document.getElementById('content-ai');

            if (tab === 'upload') {
                btnUpload.className = "flex-1 py-2 text-sm font-semibold rounded-md bg-slate-700 text-white shadow transition-all";
                btnAi.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition-all";
                contentUpload.classList.remove('hidden');
                contentAi.classList.add('hidden');
            } else {
                btnAi.className = "flex-1 py-2 text-sm font-semibold rounded-md bg-slate-700 text-white shadow transition-all";
                btnUpload.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-400 hover:text-white transition-all";
                contentAi.classList.remove('hidden');
                contentUpload.classList.add('hidden');
            }
        }

        // Notification Helper
        function showNotify(msg, type = 'error') {
            const box = document.getElementById('notification-box');
            box.textContent = msg;
            
            if (type === 'error') {
                box.className = "p-4 rounded-lg text-sm font-medium bg-red-900/40 border border-red-500 text-red-200 mb-4 block";
            } else {
                box.className = "p-4 rounded-lg text-sm font-medium bg-green-900/40 border border-green-500 text-green-200 mb-4 block";
            }
            
            setTimeout(() => {
                box.classList.add('hidden');
            }, 5000);
        }

        // Upload Image from Phone/PC
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    coverImage = img;
                    updateCanvas();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Generate Image using Gemini API
        async function generateAIImage() {
            const prompt = document.getElementById('ai-prompt').value.trim();
            if (!prompt) {
                showNotify('Please enter a description for the AI.');
                return;
            }

            const btn = document.getElementById('generate-btn');
            const btnText = document.getElementById('generate-text');
            const overlay = document.getElementById('canvas-overlay');
            
            btn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span>';
            overlay.classList.remove('hidden');

            const payload = {
                contents: [{
                    role: 'user',
                    parts: [{ text: `High quality album cover art without any text. Subject: ${prompt}. Atmospheric, highly detailed.` }]
                }],
                generationConfig: {
                    responseModalities: ['IMAGE'],
                    imageConfig: { aspectRatio: "1:1" }
                }
            };

            try {
                // Exponential Backoff implementation
                let response = null;
                let retries = 0;
                let maxRetries = 3;
                let delay = 1000;

                while (retries < maxRetries) {
                    response = await fetch(GEMINI_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) break;
                    if (response.status === 429) {
                        retries++;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    } else {
                        throw new Error(`API Error ${response.status}`);
                    }
                }

                if (!response || !response.ok) throw new Error('Generation failed.');

                const data = await response.json();
                const inlineData = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;
                
                if (inlineData) {
                    const img = new Image();
                    img.onload = () => {
                        coverImage = img;
                        updateCanvas();
                        showNotify('AI Image generated successfully!', 'success');
                    };
                    img.src = `data:${inlineData.mimeType};base64,${inlineData.data}`;
                } else {
                    throw new Error('Invalid response format.');
                }
            } catch (err) {
                console.error(err);
                showNotify('Failed to generate image. Please try again.');
            } finally {
                btn.disabled = false;
                btnText.innerHTML = 'Generate with AI';
                overlay.classList.add('hidden');
            }
        }

        // Draw Canvas logic
        function updateCanvas() {
            // 1. Draw Background/Image
            ctx.fillStyle = '#1e293b'; 
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            if (coverImage) {
                // Cover behavior (center crop if aspect ratio differs)
                const scale = Math.max(CANVAS_SIZE / coverImage.width, CANVAS_SIZE / coverImage.height);
                const w = coverImage.width * scale;
                const h = coverImage.height * scale;
                const x = (CANVAS_SIZE - w) / 2;
                const y = (CANVAS_SIZE - h) / 2;
                
                ctx.drawImage(coverImage, x, y, w, h);
                
                // Add top and bottom vignette gradient to ensure text readability
                const grad = ctx.createLinearGradient(0, 0, 0, CANVAS_SIZE);
                grad.addColorStop(0, 'rgba(0,0,0,0.7)');
                grad.addColorStop(0.2, 'rgba(0,0,0,0)');
                grad.addColorStop(0.8, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.8)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            } else {
                // Default artistic placeholder
                const grad = ctx.createLinearGradient(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                grad.addColorStop(0, '#4c1d95'); // purple-900
                grad.addColorStop(1, '#0f172a'); // slate-900
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                
                // Simple placeholder graphic
                ctx.strokeStyle = 'rgba(255,255,255,0.05)';
                ctx.lineWidth = 40;
                ctx.beginPath();
                ctx.arc(CANVAS_SIZE/2, CANVAS_SIZE/2, 300, 0, Math.PI*2);
                ctx.stroke();
            }

            // 2. Draw Text Overlays
            const bandInput = document.getElementById('band-name').value;
            const songInput = document.getElementById('song-name').value;
            
            const bandName = bandInput ? bandInput : document.getElementById('band-name').placeholder;
            const songName = songInput; 
            
            const fontFamily = document.getElementById('font-select').value;
            const textColor = document.getElementById('text-color').value;

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            
            // Add subtle shadow for pop
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 4;

            // Draw Band Name (Top)
            if (bandName) {
                ctx.textBaseline = 'top';
                let fontSize = 70;
                if (fontFamily === 'Bebas Neue') fontSize = 100;
                if (bandName.length > 20) fontSize = 50;

                ctx.font = `${fontFamily === 'Montserrat' ? '900' : 'normal'} ${fontSize}px '${fontFamily}'`;
                ctx.fillText(bandName.toUpperCase(), CANVAS_SIZE / 2, 80);
            }

            // Draw Song Name (Bottom)
            if (songName) {
                ctx.textBaseline = 'bottom';
                let fontSize = 120;
                if (fontFamily === 'Bebas Neue') fontSize = 180;
                if (songName.length > 15) fontSize = 90;
                if (songName.length > 25) fontSize = 70;

                ctx.font = `${fontFamily === 'Montserrat' ? '700' : 'normal'} ${fontSize}px '${fontFamily}'`;
                
                // Basic word wrapping for long titles
                if (songName.length > 18 && songName.includes(' ')) {
                    const words = songName.split(' ');
                    const half = Math.ceil(words.length / 2);
                    const line1 = words.slice(0, half).join(' ');
                    const line2 = words.slice(half).join(' ');
                    
                    ctx.fillText(line1, CANVAS_SIZE / 2, CANVAS_SIZE - 80 - (fontSize * 1.1));
                    ctx.fillText(line2, CANVAS_SIZE / 2, CANVAS_SIZE - 80);
                } else {
                    ctx.fillText(songName, CANVAS_SIZE / 2, CANVAS_SIZE - 100);
                }
            }

            // Reset shadows for next draw call
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        // Download Image
        function downloadCover() {
            const dataURL = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            
            const bandInput = document.getElementById('band-name').value;
            const songInput = document.getElementById('song-name').value;
            const bName = bandInput ? bandInput : 'MK_Iron';
            const sName = songInput ? songInput : 'Cover';
            
            // Clean filename
            const cleanName = `${bName}_${sName}`.replace(/[^a-z0-9]/gi, '_').toLowerCase();
            
            link.download = `${cleanName}.jpg`;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
